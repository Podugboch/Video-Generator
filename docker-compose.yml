services:
  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on: [redis]

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
